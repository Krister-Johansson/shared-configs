# Release automation for this repo: release-please tags vX.Y.Z releases that
# consumer repos pin their `uses:` references to (dependabot bumps them weekly).
name: self-release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags, and the GitHub release
      pull-requests: write # maintain the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Manifest mode: release-please-config.json + .release-please-manifest.json
          # (release-type: simple — bumps version.txt + CHANGELOG.md).
