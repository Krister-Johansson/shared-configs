# CI for this repo itself: lint the workflow files and shell scripts.
name: self-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        # Download script pinned to the v1.7.12 release commit.
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
      - name: Run actionlint
        # Lints .github/workflows/. The files under templates/ contain {{PLACEHOLDER}}
        # markers and are validated at consumer-setup time instead (see AGENTS.md).
        run: ./actionlint -color
      - name: Run shellcheck
        run: shellcheck scripts/*.sh
