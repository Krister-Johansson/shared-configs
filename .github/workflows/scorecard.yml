# Reusable OpenSSF Scorecard analysis.
#
# The schedule/push/branch_protection_rule triggers live in the CALLER workflow
# (cron cannot be defined in a reusable workflow) — see templates/workflows/scorecard.yml.
#
# publish_results notes: the scorecard API rejects runs from workflows with top-level
# env vars, defaults, or workflow-level write permissions — keep this file (and the
# caller) free of those.
name: Scorecard

on:
  workflow_call:
    secrets:
      SCORECARD_TOKEN:
        description: "PAT with Administration:read so Scorecard can read branch-protection rules (optional)"
        required: false

# Least-privilege by default; the analysis job elevates only what it needs.
# NOTE: must be an explicit map, not the read-all shorthand — read-all on a
# workflow involved in a reusable call makes the run fail at startup when the
# job elevates to write scopes.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow default, so restate read access
      # for the checkout and Scorecard's repo/API reads.
      contents: read
      # Upload the SARIF result to the code-scanning dashboard.
      security-events: write
      # OIDC token used to publish results to the public OpenSSF API (powers the badge).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # A PAT with Administration:read lets Scorecard read branch-protection rules
          # (the default GITHUB_TOKEN can't, which is why Branch-Protection errors). Falls
          # back to GITHUB_TOKEN until a SCORECARD_TOKEN secret is added — nothing breaks.
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          # Publish to the OpenSSF API so the README badge resolves.
          publish_results: true

      # Retain the SARIF for manual inspection / debugging.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Surface findings under Security → Code scanning.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
