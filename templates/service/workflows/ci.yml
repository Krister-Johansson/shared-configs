# Thin caller for the shared CI workflow — service profile.
# The actual jobs live in Krister-Johansson/shared-configs; dependabot keeps
# the pinned version fresh (pin set per AGENTS.md step 3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: Krister-Johansson/shared-configs/.github/workflows/ci.yml@{{SHARED_CONFIGS_SHA}} # {{SHARED_CONFIGS_VERSION}}
    with:
      run-lint: false # set true when the repo has a `lint` script
      # run-typecheck: false # only for plain-JS services
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Services usually test against their real dependencies (DB, queue, ...) —
  # uncomment and adapt. Testcontainers works on ubuntu-latest (Docker is
