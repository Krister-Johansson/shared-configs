# Thin caller for the shared release-please workflow — frontend profile.
# The actual jobs live in Krister-Johansson/shared-configs; dependabot keeps
# the pinned version fresh (pin set per AGENTS.md step 3).
#
# publish-strategy 'none': release-please still manages versions, CHANGELOG.md,
# tags, and GitHub releases from Conventional Commits. If the app deploys on
# every push via the hosting platform (Vercel/Netlify/Pages), keep just the
# release job — the releases then serve as deploy markers/changelog. For
# release-gated deploys, use the deploy job below.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: Krister-Johansson/shared-configs/.github/workflows/release-please.yml@{{SHARED_CONFIGS_SHA}} # {{SHARED_CONFIGS_VERSION}}
    permissions:
      contents: write # release commits, tags, and the GitHub release
      pull-requests: write # maintain the release PR
      # Never used with publish-strategy 'none', but the called workflow's
      # (skipped) publish jobs declare it, and GitHub validates every job of a
      # reusable workflow against the caller's grants at startup.
      id-token: write
    with:
      publish-strategy: none

  # Release-gated deploy — adapt to the platform (Vercel/Netlify CLI, Pages, S3
  # + CDN invalidation, ...). Delete if the platform already deploys on push.
