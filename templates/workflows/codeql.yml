# Thin caller for the shared CodeQL workflow. The triggers must live here
# (cron cannot be defined in a reusable workflow).
# Replace {{SHARED_CONFIGS_SHA}} / {{SHARED_CONFIGS_VERSION}} with the latest
# shared-configs release (see AGENTS.md step 4).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 7 * * 2"

permissions:
  contents: read

jobs:
  codeql:
    uses: Krister-Johansson/shared-configs/.github/workflows/codeql.yml@{{SHARED_CONFIGS_SHA}} # {{SHARED_CONFIGS_VERSION}}
    permissions:
      security-events: write # upload results to code scanning
      actions: read
      contents: read
