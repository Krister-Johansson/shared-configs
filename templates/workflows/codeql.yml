# Thin caller for the shared CodeQL workflow. The triggers must live here
# (cron cannot be defined in a reusable workflow).
# The actual jobs live in Krister-Johansson/shared-configs; dependabot keeps
# the pinned version fresh (pin set per AGENTS.md step 3).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 7 * * 2"

permissions:
  contents: read

jobs:
  codeql:
    uses: Krister-Johansson/shared-configs/.github/workflows/codeql.yml@{{SHARED_CONFIGS_SHA}} # {{SHARED_CONFIGS_VERSION}}
    permissions:
      security-events: write # upload results to code scanning
      actions: read
      contents: read
